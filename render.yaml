services:
  - type: web
    name: praise-broadcast-hub
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: TZ
        value: America/Toronto
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DB_FOLDER_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
