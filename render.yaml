services:
  - type: web
    name: praise-broadcast-hub
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY        # V873 — 라이브 악보 Claude AI (한윤종 님 계정만). 대시보드에서 직접 넣기
        sync: false
      - key: TZ
        value: America/Toronto
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DB_FOLDER_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID            # 악보 보관함 (Cloudflare R2) — README "악보 R2" 참고
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_DIRECT
        sync: false
      - key: NAS_PASSWORD
        sync: false
      - key: NAS_URL
        sync: false
      - key: NAS_ROOT
        sync: false
