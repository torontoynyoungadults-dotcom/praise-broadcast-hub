# 자동 안내 — 화요일 아침 연습 안내 · 토요일 아침 주일 안내. Render 무료 서버는 쉬는 동안 잠들어서, 그 아침에 한 번 깨워 보내게 합니다.
# 저장소 Settings → Secrets and variables → Actions 에 두 값을 넣어 주세요:
#   HUB_URL  = 앱 주소 (예: https://praise-broadcast-hub.onrender.com)
#   CRON_KEY = Render 환경변수 CRON_KEY 와 같은 값
# 서버 쪽에서 "켜짐 · 그 요일 9시 이후 · 아직 안 보냄"을 다시 확인하므로, 여러 번 불려도 한 번만 갑니다.
name: practice-reminder
on:
  schedule:
    - cron: '7 13 * * 2,6'   # 화(연습 안내) · 토(주일 안내) 09:07 토론토 (여름 · EDT)
    - cron: '7 14 * * 2,6'   # 09:07 토론토 (겨울 · EST) / 여름에는 10:07 — 이미 보냈으면 건너뜀
    # 화~토 낮 · 저녁 매시 — 화요일에 콘티가 준비 중이었으면, 다 올라오고 1시간 뒤 "연습 콘티가 올라왔어요" 를 보내려고 깨움
    - cron: '37 15-23 * * 2-6'
    - cron: '37 0-3 * * 3-6'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the hub and send this week's practice notices
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          if [ -z "$HUB_URL" ] || [ -z "$CRON_KEY" ]; then echo "HUB_URL / CRON_KEY secrets are not set"; exit 0; fi
          curl -sS --max-time 90 "$HUB_URL/healthz" || true
          for i in 1 2 3; do
            if curl -sS --fail --max-time 120 -H "X-Cron-Key: $CRON_KEY" "$HUB_URL/cron/practice-reminder"; then echo; exit 0; fi
            sleep 30
          done
          exit 1
